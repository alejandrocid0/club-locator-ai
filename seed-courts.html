<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seed Pistas de Pádel → Supabase</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0f0f0f; color: #e0e0e0; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p { color: #888; font-size: 0.9rem; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 24px; background: #1a1a1a; border-radius: 8px; padding: 16px; font-size: 0.85rem; font-family: monospace; line-height: 1.6; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Seed Pistas de Pádel — OSM → Supabase</h1>
  <p>Descarga todas las pistas de pádel de España desde OpenStreetMap e inserta en Supabase.<br>Tarda entre 1 y 3 minutos.</p>
  <button id="btn" onclick="runSeed()">Cargar pistas desde OSM</button>
  <div id="log"></div>

<script>
const SUPABASE_URL = 'https://xoaljtqznzvlhwwnxnjv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvYWxqdHF6bnp2bGh3d254bmp2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDA0NjA5NSwiZXhwIjoyMDk1NjIyMDk1fQ.XHJxw0zMFTYmcnrQHXurv_PaXZ0YAmojB7FqFZzV-WM';
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
const SPAIN_BBOX = '27.6,-18.2,43.8,4.4';

const QUERY = `[out:json][timeout:180];
(
  node["sport"="padel"](${SPAIN_BBOX});
  way["sport"="padel"](${SPAIN_BBOX});
  node["leisure"="pitch"]["sport"="padel"](${SPAIN_BBOX});
  way["leisure"="pitch"]["sport"="padel"](${SPAIN_BBOX});
  node["leisure"="sports_centre"]["sport"="padel"](${SPAIN_BBOX});
  way["leisure"="sports_centre"]["sport"="padel"](${SPAIN_BBOX});
);
out center tags;`;

const logEl = document.getElementById('log');
const btn = document.getElementById('btn');

function log(msg, cls = '') {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

function isIndoor(tags) {
  return tags.indoor === 'yes' || tags.covered === 'yes' ||
    ['yes', 'sports_hall', 'sport'].includes(tags.building ?? '');
}

async function supabaseUpsert(batch) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/courts`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'resolution=ignore-duplicates',
    },
    body: JSON.stringify(batch),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Supabase error ${res.status}: ${text}`);
  }
}

async function runSeed() {
  btn.disabled = true;
  logEl.innerHTML = '';

  try {
    log('Consultando Overpass API (puede tardar 1-3 minutos)...', 'info');

    const mirrors = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.ru/api/interpreter',
    ];

    let json = null;
    for (const mirror of mirrors) {
      try {
        log(`Probando ${mirror}...`);
        const res = await fetch(mirror, {
          method: 'POST',
          body: 'data=' + encodeURIComponent(QUERY),
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          signal: AbortSignal.timeout(200000),
        });
        if (!res.ok) { log(`  → Status ${res.status}, probando siguiente...`); continue; }
        json = await res.json();
        log(`  → OK (${json.elements?.length ?? 0} elementos)`, 'ok');
        break;
      } catch (e) {
        log(`  → Error: ${e.message}`);
      }
    }

    if (!json) throw new Error('Todos los mirrors de Overpass fallaron.');

    const elements = json.elements ?? [];
    log(`\nParsing ${elements.length} elementos OSM...`, 'info');

    const courts = elements.map(el => {
      const tags = el.tags ?? {};
      const lat = el.lat ?? el.center?.lat;
      const lng = el.lon ?? el.center?.lon;
      if (!lat || !lng) return null;
      return {
        osm_id: `${el.type}_${el.id}`,
        name: tags.name ?? tags.operator ?? null,
        lat,
        lng,
        is_indoor: isIndoor(tags),
        source: 'osm',
        verified: false,
      };
    }).filter(Boolean);

    const indoor = courts.filter(c => c.is_indoor).length;
    const outdoor = courts.length - indoor;
    log(`${courts.length} pistas válidas (${indoor} indoor, ${outdoor} outdoor)`, 'info');

    // Insert in batches of 200
    const batchSize = 200;
    let inserted = 0;
    for (let i = 0; i < courts.length; i += batchSize) {
      const batch = courts.slice(i, i + batchSize);
      await supabaseUpsert(batch);
      inserted += batch.length;
      log(`Batch ${Math.floor(i/batchSize)+1}: ${inserted}/${courts.length} procesadas`);
    }

    log(`\n✅ Completado: ${inserted} pistas cargadas en Supabase`, 'ok');
    log(`   Indoor: ${indoor} | Outdoor: ${outdoor}`, 'ok');

  } catch (err) {
    log(`\n❌ Error: ${err.message}`, 'err');
  }

  btn.disabled = false;
}
</script>
</body>
</html>
